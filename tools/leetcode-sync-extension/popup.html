<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DSAverse Sync</title>
  <style>
    body {
      width: 330px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
    }
    .logo { font-size: 20px; }
    .title { font-size: 14px; font-weight: 700; color: #38bdf8; }
    .subtitle { font-size: 11px; color: #94a3b8; }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 12px;
    }
    .label { color: #94a3b8; }
    .val { font-weight: 600; color: #f1f5f9; }
    .badge-accepted { color: #34d399; }
    .badge-wa { color: #f87171; }
    
    .status-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .status-synced { background: rgba(52, 211, 153, 0.15); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3); }
    .status-waiting { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
    .status-retry { background: rgba(251, 191, 36, 0.15); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); }
    .status-unavailable { background: rgba(248, 113, 113, 0.15); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.3); }
    .status-unsupported { background: rgba(148, 163, 184, 0.15); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.3); }

    .btn {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 6px;
    }
    .btn-primary { background: #38bdf8; color: #0f172a; }
    .btn-primary:hover { background: #0ea5e9; }
    .btn-secondary { background: #334155; color: #f8fafc; }
    .btn-secondary:hover { background: #475569; }
    .status-msg { font-size: 11px; text-align: center; margin-top: 6px; color: #94a3b8; }
    .status-success { color: #34d399; }
    .status-error { color: #f87171; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚡</div>
    <div>
      <div class="title">DSAverse LeetCode Sync</div>
      <div class="subtitle">Automatic Submission Pipeline</div>
    </div>
  </div>

  <div id="statusBanner" class="status-banner status-waiting">
    <span id="statusIcon">⏳</span>
    <span id="statusText">Waiting for synchronization</span>
  </div>

  <div class="card">
    <div class="row">
      <span class="label">Problem:</span>
      <span class="val" id="slugVal">Detecting...</span>
    </div>
    <div class="row">
      <span class="label">Language:</span>
      <span class="val" id="langVal">-</span>
    </div>
    <div class="row">
      <span class="label">Verdict:</span>
      <span class="val" id="verdictVal">-</span>
    </div>
    <div class="row">
      <span class="label">Code Snapshot:</span>
      <span class="val" id="codeLenVal">0 chars</span>
    </div>
    <div class="row" id="queueRow" style="display: none;">
      <span class="label">Retry Queue:</span>
      <span class="val" id="queueVal" style="color: #fbbf24;">0 pending</span>
    </div>
  </div>

  <button id="syncBtn" class="btn btn-primary" type="button">⚡ Sync Now</button>
  <button id="retryBtn" class="btn btn-secondary" type="button" style="display: none;">🔄 Process Retry Queue</button>
  <button id="copyBtn" class="btn btn-secondary" type="button">📋 Copy JSON Payload</button>

  <div id="statusMsg" class="status-msg">Auto-sync runs automatically on submit.</div>
  <script src="popup.js"></script>
</body>
</html>
